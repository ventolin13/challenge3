version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - copyloopvar
    - bodyclose
  settings:
    gosec:
      excludes:
        - G101
        - G304
        - G404
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
