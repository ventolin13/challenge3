services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: challenge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d challenge"]
      interval: 2s
      timeout: 2s
      retries: 20

  flyway:
    image: flyway/flyway:10
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /tmp/sql
        cp /migrations/V*.sql /tmp/sql/
        /flyway/flyway -locations=filesystem:/tmp/sql -url=jdbc:postgresql://postgres:5432/challenge -user=challenge -password=challenge -connectRetries=60 migrate
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: challenge3
